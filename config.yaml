# BTC Sniper - central configuration.
# Every operational parameter lives here; code must not hard-code values that
# appear in this file. See DATA_SPEC.md / MODEL_SPEC.md / VALIDATION_SPEC.md.
config_version: v1

project:
  name: btc-sniper
  timezone: UTC
  base_currency: USD

paths:
  data_dir: data
  logs_dir: logs
  reports_dir: reports
  models_dir: artifacts/models

logging:
  level: INFO
  file: logs/btc_sniper.log
  console: true

market:
  primary:
    exchange: binance
    symbol: BTCUSDT
    timeframe: 1d
  secondary:
    exchange: coinbase
    symbol: BTC-USD
    enabled: true

ingestion:
  binance:
    base_url: https://api.binance.com
    klines_endpoint: /api/v3/klines
    ticker_price_endpoint: /api/v3/ticker/price
    max_limit: 1000
    history_start: "2017-08-17"
    request_timeout_seconds: 20
    max_retries: 5
    backoff_initial_seconds: 1.0
    backoff_multiplier: 2.0
    backoff_max_seconds: 30.0
    min_request_interval_seconds: 0.25
  coinbase:
    base_url: https://api.exchange.coinbase.com
    candles_endpoint: /products/{product_id}/candles
    granularity_seconds: 86400
    max_candles_per_request: 300
    request_timeout_seconds: 20
    max_retries: 5
    backoff_initial_seconds: 1.0
    backoff_multiplier: 2.0
    backoff_max_seconds: 30.0
    min_request_interval_seconds: 0.25

# Realtime price is for UI freshness ONLY. It never feeds the model and never
# overwrites a closed daily candle (DATA_SPEC.md section 1).
realtime:
  source: binance_websocket
  rest_fallback: true
  dashboard_refresh_seconds: 5
  websocket_url: wss://stream.binance.com:9443/ws
  # @miniTicker emits one summary per second. @trade emits every single trade,
  # which on BTCUSDT is thousands per second - far more than a price display
  # needs. Both are parsed; the stream only changes how often we are woken up.
  stream_suffix: "@miniTicker"
  reconnect_initial_seconds: 1.0
  reconnect_multiplier: 2.0
  reconnect_max_seconds: 60.0
  reconnect_jitter_seconds: 0.5
  # No message for this long means the connection is dead even if the socket
  # still looks open; force a reconnect.
  heartbeat_timeout_seconds: 30
  ping_interval_seconds: 20
  ping_timeout_seconds: 20
  # Bounds how long a graceful shutdown waits for the close handshake.
  close_timeout_seconds: 3
  # A tick older than this is treated as stale and triggers the REST fallback.
  max_price_age_seconds: 60
  # Ticks arrive far faster than they need to be persisted; write at most one
  # row per interval so SQLite is not hammered.
  persist_interval_seconds: 2.0
  retention_hours: 48
  # Reject a tick this far from the last closed daily close. Guards the display
  # against a corrupted feed; 2020-03-12, the worst day on record, moved 39.6%.
  max_deviation_from_last_close_pct: 50.0

data_quality:
  # Hard failures (block the daily pipeline) - see DATA_SPEC.md section 7.
  max_missing_day_ratio: 0.005
  require_no_duplicate_keys: true
  require_monotonic_open_time: true
  require_valid_ohlc_relationship: true
  require_non_negative_volume: true
  # Warnings only (never delete legitimate crash/pump candles).
  extreme_daily_log_return_warn: 0.25
  zero_volume_warn: true
  cross_exchange_close_diff_warn_pct: 1.0
  cross_exchange_check_days: 120
  max_staleness_days: 2

forecast:
  anchor: last_closed_daily_candle
  target: future_log_return
  max_horizon_days: 365
  horizon_grid_version: v1
  # Bands are anchored on their END day so that 30 / 90 / 180 / 365 are always
  # produced exactly; spacing inside a band is regular (see MODEL_SPEC.md 2).
  horizon_grid:
    daily_until: 30
    every_n_days_31_90: 3
    every_n_days_91_180: 7
    every_n_days_181_365: 14
  required_evaluation_horizons: [1, 7, 30, 90, 180, 365]
  quantiles: [0.025, 0.10, 0.25, 0.50, 0.75, 0.90, 0.975]
  # How much of the forecast comes from the model rather than the baseline, per
  # horizon. FROZEN from inner validation (MODEL_SPEC.md 6.5): the tree beats the
  # no_change baseline in every fold at h=1, ties at h=7 and is worse from h=30
  # outward. Serving the model everywhere would knowingly ship a worse forecast;
  # a hard switch would put a visible jump in the curve at the boundary.
  # These weights are not re-tuned per forecast -- a weight derived from recent
  # performance is a model selected on the data it is about to be scored against.
  blend:
    enabled: true
    full_model_horizon_days: 1     # model only up to here
    baseline_only_horizon_days: 30 # baseline only from here
    mode: linear                   # linear ramp between the two
  visualization:
    interpolation: pchip
    show_intervals: [0.50, 0.80, 0.95]

features:
  version: v1
  groups:
    - price_return
    - trend
    - volatility
    - volume
    - regime
  # Minimum history required before a feature row is considered usable.
  min_warmup_days: 365
  params:
    return_periods: [1, 3, 7, 14, 30, 90]
    sma_windows: [7, 14, 30, 50, 100, 200]
    ema_windows: [12, 26, 50, 200]
    ma_slope_window: 20
    momentum_windows: [10, 30, 90]
    rsi_window: 14
    macd: {fast: 12, slow: 26, signal: 9}
    bollinger: {window: 20, num_std: 2.0}
    atr_window: 14
    volatility_windows: [7, 14, 30, 90]
    realized_vol_annualization_days: 365
    extreme_windows: [30, 90, 365]
    drawdown_windows: [90, 365]
    volume_windows: [7, 30, 90]
  regime:
    trend_fast_window: 50
    trend_slow_window: 200
    drawdown_window: 365
    direction_return_window: 90
    direction_return_threshold: 0.10
    bear_drawdown_threshold: 0.20
    volatility_window: 30
    volatility_rank_window: 365
    volatility_rank_min_periods: 180
    high_volatility_quantile: 0.70
    low_volatility_quantile: 0.30

models:
  primary_algorithm: lightgbm_quantile
  alternatives:
    - xgboost
    - lstm
    - tcn
    - transformer
  random_seed: 42
  training_windows:
    - expanding
    - rolling_4y
    - rolling_5y
    - rolling_8y
  # Which window a single training run uses when none is named. The comparison
  # in MODEL_SPEC.md section 7 picks the real one from inner validation.
  default_training_window: expanding
  # SELECTED ON INNER VALIDATION, 2026-09-14. See MODEL_SPEC.md section 6.4.
  # The first guess (300 rounds, 15 leaves, lambda 1.0) was badly under-regularised:
  # 95% interval coverage came out at 0.62 against a nominal 0.95 at h=30, because
  # with ~53 independent observations the extreme quantiles were fitted to noise.
  # Regularisation fixes the calibration monotonically.
  lightgbm:
    n_estimators: 80
    learning_rate: 0.02
    num_leaves: 3
    max_depth: 2
    min_child_samples: 300
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.5
    reg_alpha: 0.0
    reg_lambda: 50.0
    min_split_gain: 0.0

  # Pre-declared alternatives, compared once with
  # `python -m jobs.walk_forward --compare-params`. Declared up front rather than
  # hill-climbed: repeatedly adjusting one number and re-checking the same folds is
  # the validation overfitting VALIDATION_SPEC.md section 5 prohibits.
  lightgbm_candidates:
    under_regularised:   # the original guess, kept as the negative control
      n_estimators: 300
      learning_rate: 0.05
      num_leaves: 15
      max_depth: 6
      min_child_samples: 50
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      reg_lambda: 1.0
    moderate:
      n_estimators: 150
      learning_rate: 0.03
      num_leaves: 7
      max_depth: 4
      min_child_samples: 150
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.6
      reg_lambda: 10.0
    strong:
      n_estimators: 80
      learning_rate: 0.02
      num_leaves: 3
      max_depth: 2
      min_child_samples: 300
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.5
      reg_lambda: 50.0
    stumps:            # depth-1: the near-degenerate limit, as a lower bound
      n_estimators: 40
      learning_rate: 0.02
      num_leaves: 2
      max_depth: 1
      min_child_samples: 400
      reg_lambda: 100.0

# Naive references every candidate model must beat (MODEL_SPEC.md section 6,
# VALIDATION_SPEC.md section 8). All three share one spread model and differ
# only in the location they predict, so a comparison isolates the trend claim.
baselines:
  enabled:
    - no_change        # location = 0: the price is a random walk
    - drift            # location = long-run mean daily log return x h
    - rolling_return   # location = recent mean daily log return x h
    - empirical        # location = historical MEDIAN h-day log return
  drift_min_samples: 365
  rolling_return_window_days: 90
  # Prediction intervals come from the empirical distribution of PAST h-day log
  # returns observed up to the origin, recentered on the predicted location.
  # Empirical rather than Gaussian because BTC returns are fat-tailed and skewed;
  # a sigma*sqrt(h) band would understate the tails it is supposed to cover.
  empirical_quantile:
    lookback_days: null   # null = expanding (every observation up to the origin)
    min_samples: 60       # overlapping, so the independent count is min_samples/h

validation:
  method: walk_forward
  outer_test_reserved: true
  validation_origin_spacing_days: 30

  # Folds are laid out backwards from inner_validation_end so the most recent
  # validation block is always complete (VALIDATION_SPEC.md section 2).
  walk_forward:
    n_folds: 5
    validation_days: 365
    # Below this a fold's metric looks real and is not; the fold is dropped.
    min_train_origins: 250

  # --- FROZEN SPLIT. See VALIDATION_SPEC.md section 4.2 for the rationale.
  # Changing outer_test_start invalidates every recorded outer-test metric and
  # requires a new split_version. Do not move it to chase a better result.
  split_version: v1
  outer_test_start: "2024-01-01"
  outer_test_frozen_at: "2026-09-14"
  outer_test_end: null            # null = roll forward with the newest data
  inner_validation_end: "2023-12-31"
  # Training origins must satisfy: origin + horizon + embargo_days < outer_test_start.
  # The purge length is the horizon itself, so it is not a fixed number here.
  purge_mode: horizon
  embargo_days: 0
  max_outer_test_evaluations_per_model_version: 1
  # Horizons where the data cannot supply enough independent windows for a
  # statistical verdict. Reported, but never the sole basis for promotion or
  # rejection (VALIDATION_SPEC.md section 4.3).
  low_power_horizon_days: 180
  metrics:
    - mae
    - rmse
    - smape
    - direction_accuracy
    - pinball_loss
    - interval_coverage
    - interval_width
  regimes:
    - bull
    - bear
    - recovery
    - sideways
    - high_volatility
    - low_volatility

operation:
  forecast_frequency: daily
  model_review_frequency: weekly
  min_new_observations_since_training: 14
  # Retraining triggers (OPERATING_SPEC.md section 3). These report; the weekly
  # review decides. Nothing here retrains anything on its own.
  drift:
    # Fixed PSI thresholds, used only when calibration is off or impossible.
    # These are the conventional credit-scoring values and they badly over-report
    # on autocorrelated daily features, so they are a fallback, not the rule.
    feature_psi_warn: 0.10
    feature_psi_alert: 0.25
    psi_bins: 10
    # Calibrate the thresholds against no-drift windows instead. A contiguous
    # 90-day window taken from INSIDE the training period already puts 48 of 64
    # features past 0.25 on this dataset: daily features are strongly
    # autocorrelated, so one window is one regime, not a random sample. A trigger
    # that fires every time teaches the reader to ignore it.
    calibration:
      enabled: true
      # 60 windows, because a 0.99 quantile estimated from 24 draws is essentially
      # the maximum and swings with the seed. 0.95 of 60 is the ~3rd largest.
      samples: 60
      warn_quantile: 0.80
      alert_quantile: 0.95
      seed: 20260914
    recent_days: 90
    # Production worse than its own validation benchmark by more than this.
    performance_degradation_fraction: 0.20
    # Below this many realized forecasts a horizon cannot trigger anything
    # (OPERATING_SPEC.md section 4).
    min_realized_for_drift: 20
  production_promotion:
    require_validation_improvement: true
    min_improvement_fraction: 0.02
    require_stability_across_folds: true
    require_interval_coverage_not_materially_worse: true
    min_realized_forecasts_per_horizon: 20

storage:
  database: btc_forecast.db

streamlit:
  pages:
    - dashboard
    - prediction_log
    - model_performance
  show_realtime_price: true
  show_forecast_interval: true
  show_forecast_revision: true
  forecast_revision_days: 30

notifications:
  enabled: false
